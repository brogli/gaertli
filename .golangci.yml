version: "2"

run:
  build-tags: [bench]

linters:
  default: standard
  enable:
    - contextcheck
    - errorlint
    - gocritic
    - intrange
    - modernize
    - nilerr
    - perfsprint
    - revive
    - thelper
    - usetesting
  settings:
    revive:
      rules:
        - name: context-as-argument
        - name: package-comments
        - name: redefines-builtin-id

formatters:
  enable:
    - gofmt
    - goimports
