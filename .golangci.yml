version: '2'

run:
  build-tags: [bench]

linters:
  default: standard
  enable:
    - contextcheck
    - depguard
    - errorlint
    - gocritic
    - intrange
    - modernize
    - nilerr
    - perfsprint
    - revive
    - thelper
    - usetesting
  settings:
    depguard:
      rules:
        no-network:
          # git itself talks to the network; this package only shells out to it.
          files: ['**/internal/git/**']
          deny:
            - pkg: net$
              desc: internal/git only shells out to git
            - pkg: net/http
              desc: internal/git only shells out to git
    revive:
      rules:
        - name: context-as-argument
        - name: package-comments
        - name: redefines-builtin-id
