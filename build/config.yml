# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

info:
  companyName: 'brogli'
  productName: 'Gärtli'
  productIdentifier: 'ch.gaertli.app'
  description: 'The git tool that sits beside your editor'
  copyright: 'Copyright (c) 2026, brogli'
  comments: ''
  # The release version (semantic versioning), raised by hand before each release.
  version: '0.1.1'

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - '*_test.go'
    watched_extension:
      - '*.go'
      - '*.js'
      - '*.ts' # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:
