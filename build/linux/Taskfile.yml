# Based on the Wails v3 build template (github.com/wailsapp/wails, MIT).
version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application natively on Linux
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
      - task: generate:dotdesktop
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg:
          'garble is required for obfuscated builds. Install it with: go install
          mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See
          https://github.com/burrowers/garble/releases for version/toolchain compatibility.'
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}}
        {{.BUILD_FLAGS}} -o {{.OUTPUT}} ./cmd/gaertli'
    vars:
      BUILD_FLAGS:
        '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED
        "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}}
        {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED
        "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath
        -buildvcs=false -ldflags="-w -s -X
        github.com/brogli/gaertli/internal/buildinfo.App={{.VERSION}} -X
        github.com/brogli/gaertli/internal/buildinfo.Commit={{.COMMIT}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages the application for Linux
    deps:
      - task: build
    cmds:
      - task: create:deb
      - task: create:rpm
      - task: create:tarball

  package:dryrun:
    summary: Builds the deb, rpm and tar.gz into dist/, mirroring release.yml's linux-windows job
    cmds:
      - task: create:deb
      - task: create:rpm
      - task: create:tarball
      - mkdir -p dist
      - mv {{.BIN_DIR}}/{{.APP_NAME}}.deb dist/{{.APP_NAME}}-linux-amd64.deb
      - mv {{.BIN_DIR}}/{{.APP_NAME}}.rpm dist/{{.APP_NAME}}-linux-amd64.rpm
      - mv {{.BIN_DIR}}/{{.APP_NAME}}.tar.gz dist/{{.APP_NAME}}-linux-amd64.tar.gz

  create:tarball:
    summary:
      Creates a self-contained tar.gz (binary, LICENSE, THIRD-PARTY-NOTICES.txt) for distributions
      without a deb/rpm package manager
    deps:
      - task: build
    cmds:
      - rm -rf {{.STAGE_DIR}}
      - mkdir -p {{.STAGE_DIR}}
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.ROOT_DIR}}/LICENSE {{.STAGE_DIR}}/
      - task: :licence-check
        vars: { OUT: '{{.STAGE_DIR}}/THIRD-PARTY-NOTICES.txt' }
      - tar -C {{.STAGE_ROOT}} -czf {{.OUTPUT}} {{.APP_NAME}}
    vars:
      STAGE_ROOT: '{{.ROOT_DIR}}/bin/tarball'
      STAGE_DIR: '{{.ROOT_DIR}}/bin/tarball/{{.APP_NAME}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}.tar.gz'
      OUTPUT: '{{.OUTPUT | default .DEFAULT_OUTPUT}}'

  create:deb:
    summary: Creates a deb package
    deps:
      - task: build
    cmds:
      - task: generate:dotdesktop
      - task: generate:deb

  create:rpm:
    summary: Creates a rpm package
    deps:
      - task: build
    cmds:
      - task: generate:dotdesktop
      - task: generate:rpm

  create:aur:
    summary: Creates a arch linux packager package
    deps:
      - task: build
    cmds:
      - task: generate:dotdesktop
      - task: generate:aur

  generate:deb:
    summary: Creates a deb package
    cmds:
      - wails3 tool package -name "{{.APP_NAME}}" -format deb -config ./build/linux/nfpm/nfpm.yaml
        -out {{.ROOT_DIR}}/bin
    env:
      PRODUCT_VERSION: '{{.PRODUCT_VERSION}}'

  generate:rpm:
    summary: Creates a rpm package
    cmds:
      - wails3 tool package -name "{{.APP_NAME}}" -format rpm -config ./build/linux/nfpm/nfpm.yaml
        -out {{.ROOT_DIR}}/bin
    env:
      PRODUCT_VERSION: '{{.PRODUCT_VERSION}}'

  generate:aur:
    summary: Creates a arch linux packager package
    cmds:
      - wails3 tool package -name "{{.APP_NAME}}" -format archlinux -config
        ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin
    env:
      PRODUCT_VERSION: '{{.PRODUCT_VERSION}}'

  generate:dotdesktop:
    summary: Generates a `.desktop` file
    dir: build
    cmds:
      - mkdir -p {{.ROOT_DIR}}/build/linux/appimage
      - wails3 generate .desktop -name "Gärtli" -exec "{{.EXEC}}" -icon "{{.ICON}}" -outputfile
        "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop" -categories "{{.CATEGORIES}}"
    vars:
      APP_NAME: '{{.APP_NAME}}'
      EXEC: '{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}'
      CATEGORIES: 'Development;'
      OUTPUTFILE: '{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'

  sign:deb:
    summary: Signs the DEB package
    desc: |
      Signs the .deb package with a PGP key.
      Set PGP_KEY in the vars section to override the key configured globally via
      `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: create:deb
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}*.deb" {{if .PGP_KEY}}--pgp-key
        "{{.PGP_KEY}}"{{end}} {{if .SIGN_ROLE}}--role "{{.SIGN_ROLE}}"{{end}}

  sign:rpm:
    summary: Signs the RPM package
    desc: |
      Signs the .rpm package with a PGP key.
      Set PGP_KEY in the vars section to override the key configured globally via
      `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: create:rpm
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}*.rpm" {{if .PGP_KEY}}--pgp-key
        "{{.PGP_KEY}}"{{end}}

  sign:packages:
    summary: Signs all Linux packages (DEB and RPM)
    desc: |
      Signs both .deb and .rpm packages with a PGP key.
      Set PGP_KEY in the vars section to override the key configured globally via
      `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    cmds:
      - task: sign:deb
      - task: sign:rpm
