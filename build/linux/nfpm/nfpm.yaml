name: 'gaertli'
arch: ${GOARCH}
platform: 'linux'
version: '${PRODUCT_VERSION}'
section: 'default'
priority: 'extra'
maintainer: 'Gärtli <28339986+brogli@users.noreply.github.com>'
description: 'Desktop git GUI that sits beside your editor'
vendor: 'Gärtli'
homepage: 'https://github.com/brogli/gaertli'
license: 'BSD-3-Clause'
release: '1'

contents:
  - src: './bin/gaertli'
    dst: '/usr/bin/gaertli'
  - src: './build/appicon.png'
    dst: '/usr/share/icons/hicolor/1024x1024/apps/gaertli.png'
  - src: './build/linux/gaertli.desktop'
    dst: '/usr/share/applications/gaertli.desktop'
  # Ubuntu's AppArmor denies user namespaces to programs without a profile;
  # WebKitGTK's sandbox needs them. Inert where AppArmor does not run.
  - src: './build/linux/apparmor/gaertli'
    dst: '/etc/apparmor.d/gaertli'
    type: config
    packager: deb

# GTK4 and WebKitGTK 6.0. git is the user's own: the app checks its
# version at start.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  # Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: './build/linux/nfpm/scripts/postinstall.sh'
