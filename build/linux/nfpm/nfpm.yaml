name: 'nebegit'
arch: ${GOARCH}
platform: 'linux'
version: '0.1.0'
section: 'default'
priority: 'extra'
maintainer: 'nebegit <28339986+brogli@users.noreply.github.com>'
description: 'Desktop git GUI that sits beside your editor'
vendor: 'nebegit'
homepage: 'https://github.com/brogli/nebegit'
license: 'BSD-3-Clause'
release: '1'

contents:
  - src: './bin/nebegit'
    dst: '/usr/bin/nebegit'
  - src: './build/appicon.png'
    dst: '/usr/share/icons/hicolor/1024x1024/apps/nebegit.png'
  - src: './build/linux/nebegit.desktop'
    dst: '/usr/share/applications/nebegit.desktop'

# GTK4 and WebKitGTK 6.0. git is the user's own: the app checks its
# version at start.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  # Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: './build/linux/nfpm/scripts/postinstall.sh'
