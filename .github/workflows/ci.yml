name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  linux:
    # The Nix shell supplies GTK4, WebKitGTK, golangci-lint, treefmt, the
    # task and wails3 shims and Playwright's browsers.
    strategy:
      fail-fast: false
      matrix:
        task: [ci, e2e, e2e:real]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: 'nix develop --command bash -eo pipefail {0}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # Go is not part of the Nix shell. Caches the module and build caches.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Setup (online)
        run: task setup

      - name: ${{ matrix.task }} (offline)
        env:
          GOPROXY: off
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          npm_config_offline: 'true'
        run: task ${{ matrix.task }}

      - name: Upload Playwright report
        if: failure() && matrix.task != 'ci'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: frontend/playwright-report/
          retention-days: 7

  windows:
    # Only Windows can run the Go tests' Windows paths (processes, paths,
    # the WSL core). The Windows binary itself is cross-compiled on Linux,
    # in the linux job's `task ci`.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup (online)
        run: go mod download

      - name: Go tests (offline)
        env:
          GOPROXY: off
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: go tool task test:go:core

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup (online)
        run: |
          go tool task setup
          go install tool

      - name: build (offline)
        env:
          GOPROXY: off
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          npm_config_offline: 'true'
        run: task build

  git-2-42:
    # The Go tests also run against the oldest supported git (git.MinVersion),
    # built from source since ubuntu-24.04 ships a newer one. No frontend
    # build, so only the packages that do not embed it; race detector on.
    # Outside the Nix shell: apt supplies the GTK4 and WebKitGTK headers the
    # Wails shell package builds against.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache git 2.42 build
        id: git-2-42-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/git-2.42
          key: git-2.42.4-ubuntu-24.04-v1

      - name: Build git 2.42 (online)
        if: steps.git-2-42-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y dh-autoreconf zlib1g-dev
          curl -fsSL https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.42.4.tar.gz -o /tmp/git-2.42.tar.gz
          tar xzf /tmp/git-2.42.tar.gz -C /tmp
          cd /tmp/git-2.42.4
          make configure
          ./configure --prefix=/opt/git-2.42
          make NO_CURL=1 NO_EXPAT=1 NO_GETTEXT=1 NO_TCLTK=1 NO_OPENSSL=1 -j"$(nproc)" all
          make NO_CURL=1 NO_EXPAT=1 NO_GETTEXT=1 NO_TCLTK=1 NO_OPENSSL=1 install

      - name: Put git 2.42 first on PATH
        run: echo /opt/git-2.42/bin >> "$GITHUB_PATH"

      - name: Setup (online)
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
          go mod download

      - name: Go tests with the race detector on git 2.42 (offline)
        env:
          GOPROXY: off
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          git --version
          go tool task test:go:core FLAGS=-race
