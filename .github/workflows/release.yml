name: release candidate

# Started by hand on main, on a commit CI has passed: builds every artifact and
# leaves them in a draft release. Publishing the draft by hand creates the tag
# on the built commit, so what ships is what was checked.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Refuse any branch but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release candidates are built from main only."
          exit 1

      - name: Refuse a commit CI has not passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --json databaseId --jq length)
          if [ "$passed" = 0 ]; then
            echo "::error::ci has not passed on $GITHUB_SHA: wait for its run, or start one."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publishing a draft creates its tag: an existing tag is a released version.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(build/release-version.sh)
          if gh api "repos/$GH_REPO/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "::error::v$version is already released: raise the version in build/config.yml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  linux-windows:
    # One job: wails3 itself needs GTK to compile, and both platforms share its
    # tools and the frontend. The Windows app needs no cgo, so it is
    # cross-compiled on Linux, as in development.
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-go installs go.mod's toolchain line because GOTOOLCHAIN=local, which
      # makes it read the go line, comes after it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Native deps and the installer compiler
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev nsis

      - name: Setup (online)
        run: |
          go tool task setup
          go install tool

      - name: Offline from here
        run: |
          {
            echo GOPROXY=off
            echo GOTOOLCHAIN=local
            echo GOFLAGS=-mod=readonly
          } >> "$GITHUB_ENV"

      - name: Linux packages
        run: go tool task linux:package:dryrun

      - name: Windows installer and zip
        run: go tool task windows:package:dryrun

      - name: Licence check and notices
        run: go tool task licence-check OUT=dist/THIRD-PARTY-NOTICES.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-windows
          path: dist/

  darwin:
    needs: version
    runs-on: macos-latest
    continue-on-error: true # a failing macOS build never holds back the release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Setup (online)
        run: |
          go tool task setup
          go install tool

      - name: Build and package
        env:
          GOPROXY: off
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: go tool task darwin:package:dryrun

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: nebegit-darwin-arm64.zip
          path: dist/nebegit-darwin-arm64.zip
          if-no-files-found: ignore

  draft:
    needs: [version, linux-windows, darwin]
    if: always() && needs.linux-windows.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      # Attestations need a public repo (or GitHub Enterprise Cloud).
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # A draft has no tag yet: publishing it creates the tag on this commit.
      - name: Replace older drafts with this one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        # Older drafts go first: a failed candidate's draft may carry the same
        # version.
        run: |
          for id in $(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft) | .id'); do
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
          done
          gh release create "v$VERSION" dist/* --draft --target "$GITHUB_SHA" \
            --title "nebegit $VERSION ($COMMIT)" --generate-notes
