# pnpm resolves only versions published at least 7 days (10080 minutes) ago,
# transitive ones included, reducing exposure to freshly compromised releases.
minimumReleaseAge: 10080

# pnpm add pins every new dependency to the exact version it resolves.
saveExact: true

# The runtime must match the Go module's version exactly, whatever its age.
minimumReleaseAgeExclude:
  - '@wailsio/runtime'
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4
  # Renovate security update: vue-i18n@11.4.14
  - vue-i18n@11.4.14
  # Renovate security update: vite@8.3.3
  - vite@8.3.3

# Dependency build scripts, reviewed: esbuild's postinstall only verifies the
# binary that its platform package already ships, so it does not run.
allowBuilds:
  esbuild: false
